spark.eventLog.enabled true
spark.eventLog.dir hdfs:///spark-history
spark.history.fs.logDirectory hdfs:///spark-history
spark.history.ui.port 18080
# Spark is baked into the identical image on every YARN node; do not upload its
# full library set to HDFS for every application submission.
spark.yarn.jars local:/opt/spark/jars/*
# Executors on Laptop B must connect to the driver through Laptop A's LAN IP,
# not the WSL-internal host.containers.internal address.
spark.driver.host 10.249.174.143
spark.driver.bindAddress 0.0.0.0

